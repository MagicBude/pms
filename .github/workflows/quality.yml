name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pms_test
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pms -d pms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14.7

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      - name: Test with coverage
        run: uv run pytest

      - name: Smoke test fresh local installation
        env:
          DJANGO_SETTINGS_MODULE: pms.settings.local
          PMS_DATA_DIR: ${{ runner.temp }}/pms-local-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          PMS_INITIAL_ADMIN_PASSWORD: ci-only-F009-local-admin-5927
        run: |
          set -euo pipefail
          uv run python manage.py migrate --noinput
          uv run python manage.py migrate --noinput
          uv run python manage.py initialize_pms --no-color
          unset PMS_INITIAL_ADMIN_PASSWORD
          uv run python manage.py initialize_pms --no-color
          uv run python manage.py check
          log_file="${RUNNER_TEMP}/pms-local-smoke.log"
          uv run python manage.py launch_local --no-browser > "${log_file}" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          ready=0
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready > /dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "${ready}" -ne 1 ]; then
            cat "${log_file}"
            exit 1
          fi
          duplicate_log="${RUNNER_TEMP}/pms-local-duplicate.log"
          if uv run python manage.py launch_local --no-browser > "${duplicate_log}" 2>&1; then
            echo "Duplicate local launcher unexpectedly succeeded."
            exit 1
          fi
          if ! grep -q "已经有本机服务" "${duplicate_log}"; then
            cat "${duplicate_log}"
            exit 1
          fi
          kill "${server_pid}" 2>/dev/null || true
          wait "${server_pid}" || true
          trap - EXIT

          backup_root="${RUNNER_TEMP}/pms-local-backups-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          restored_data="${RUNNER_TEMP}/pms-local-restored-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${backup_root}"
          uv run python manage.py backup_local --destination "${backup_root}"
          mapfile -t backup_sets < <(find "${backup_root}" -mindepth 1 -maxdepth 1 -type d)
          if [ "${#backup_sets[@]}" -ne 1 ]; then
            echo "Expected exactly one local backup set."
            exit 1
          fi
          backup_set="${backup_sets[0]}"
          uv run python manage.py verify_local_backup --backup-set "${backup_set}"
          uv run python manage.py restore_local \
            --backup-set "${backup_set}" \
            --target-data-dir "${restored_data}"

          export PMS_DATA_DIR="${restored_data}"
          uv run python manage.py check
          restored_log_file="${RUNNER_TEMP}/pms-local-restored-smoke.log"
          uv run python manage.py launch_local --no-browser \
            > "${restored_log_file}" 2>&1 &
          restored_server_pid=$!
          trap 'kill "${restored_server_pid}" 2>/dev/null || true' EXIT
          restored_ready=0
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready > /dev/null; then
              restored_ready=1
              break
            fi
            sleep 0.5
          done
          if [ "${restored_ready}" -ne 1 ]; then
            cat "${restored_log_file}"
            exit 1
          fi
          kill "${restored_server_pid}" 2>/dev/null || true
          wait "${restored_server_pid}" || true
          trap - EXIT

      - name: Verify PMS migrations and security boundaries on PostgreSQL 18
        env:
          DJANGO_SETTINGS_MODULE: pms.settings.test
          PMS_TEST_DATABASE: postgresql
          PMS_SECRET_KEY: ci-only-secret-key-not-for-production-identity-tests
          PMS_DB_NAME: pms_test
          PMS_DB_USER: pms
          PMS_DB_PASSWORD: ci-only-password
          PMS_DB_HOST: 127.0.0.1
          PMS_DB_PORT: "5432"
          PMS_INITIAL_ADMIN_PASSWORD: ci-only-F009-postgresql-admin-5927
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py migrate --noinput
          uv run python manage.py initialize_pms --no-color
          unset PMS_INITIAL_ADMIN_PASSWORD
          uv run python manage.py initialize_pms --no-color
          uv run pytest tests/integration/identity tests/integration/tenancy tests/integration/authorization tests/integration/audit tests/integration/platform tests/integration/attachments tests/integration/bootstrap --no-cov

      - name: Smoke test PostgreSQL 18 server startup
        env:
          DJANGO_SETTINGS_MODULE: pms.settings.lan
          PMS_SECRET_KEY: ci-only-secret-key-not-for-production-startup-smoke
          PMS_ALLOWED_HOSTS: 127.0.0.1
          PMS_DB_NAME: pms_test
          PMS_DB_USER: pms
          PMS_DB_PASSWORD: ci-only-password
          PMS_DB_HOST: 127.0.0.1
          PMS_DB_PORT: "5432"
        run: |
          set -euo pipefail
          uv run python manage.py check
          log_file="${RUNNER_TEMP}/pms-postgresql-smoke.log"
          uv run uvicorn pms.asgi:application --host 127.0.0.1 --port 8000 \
            > "${log_file}" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          ready=0
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready > /dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "${ready}" -ne 1 ]; then
            cat "${log_file}"
            exit 1
          fi
          kill "${server_pid}" 2>/dev/null || true
          wait "${server_pid}" || true
          trap - EXIT

      - name: Django system and migration checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Audit synchronized environment
        run: uv run pip-audit --local --skip-editable --progress-spinner off
