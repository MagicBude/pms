name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pms_test
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pms -d pms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14.7

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      - name: Test with coverage
        run: uv run pytest

      - name: Verify PMS migrations and security boundaries on PostgreSQL 18
        env:
          DJANGO_SETTINGS_MODULE: pms.settings.test
          PMS_TEST_DATABASE: postgresql
          PMS_SECRET_KEY: ci-only-secret-key-not-for-production-identity-tests
          PMS_DB_NAME: pms_test
          PMS_DB_USER: pms
          PMS_DB_PASSWORD: ci-only-password
          PMS_DB_HOST: 127.0.0.1
          PMS_DB_PORT: "5432"
        run: |
          uv run python manage.py migrate --noinput
          uv run pytest tests/integration/identity tests/integration/tenancy tests/integration/authorization tests/integration/audit --no-cov

      - name: Django system and migration checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Audit synchronized environment
        run: uv run pip-audit --local --skip-editable --progress-spinner off
