[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "pms"
version = "0.0.0"
description = "A modular production management system for local, LAN, and cloud deployment."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2.8,<5.3",
    "openpyxl>=3.1.5,<4",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
server = [
    "psycopg[binary]>=3.2,<4",
]
dev = [
    "django-stubs>=5.2,<6",
    "mypy>=1.17,<2",
    "ruff>=0.12,<1",
]
test = [
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "pytest-django>=4.11,<5",
]
security = [
    "pip-audit>=2.9,<3",
]
